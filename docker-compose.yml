# 验证码与本地/其他设备对不上时，几乎总是宿主机时钟漂移，而不是本文件的问题。
# TOTP 算的是 floor(UnixTime / period)，UnixTime 是 UTC 绝对秒数，与时区无关：
# 容器不维护独立时钟，读的就是宿主机内核时钟，所以在这里加 TZ 或挂载
# /etc/localtime 只会改变日志显示，不会修正验证码。请在宿主机上执行：
#   timedatectl status          # 查看 System clock synchronized
#   sudo timedatectl set-ntp true
# 宿主机校准后容器立即生效，无需重启。
services:
  keyfort:
    image: ${KEYFORT_IMAGE:-ghcr.io/alterem/keyfort:latest}
    restart: unless-stopped
    init: true
    ports:
      - "${KEYFORT_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_PATH: /app/data/keyfort.db
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env before starting KeyFort}
      DEFAULT_TOTP_SECRET: ${DEFAULT_TOTP_SECRET:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      # 设为 true 仅当前面有反向代理终止 HTTPS。明文 HTTP 部署下保持关闭，
      # 否则 CSP 的 upgrade-insecure-requests 会把静态资源升级到 https,
      # 浏览器随即报 ERR_SSL_PROTOCOL_ERROR。
      FORCE_HTTPS: ${FORCE_HTTPS:-}
    volumes:
      - keyfort-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/api/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  keyfort-data:
    name: ${KEYFORT_VOLUME:-keyfort-data}
